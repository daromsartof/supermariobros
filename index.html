    <style>
        /* Custom Mario-themed background */
        body {
            background: url('https://i.imgur.com/3ZQZQ9m.png') no-repeat center center fixed;
            background-size: cover;
        }

        .mario-border {
            border: 8px solid #E52521;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .mario-button {
            background-color: #E52521;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .mario-button:hover {
            transform: scale(1.1);
        }

<body class="bg-blue-900 font-sans">
    <!-- Header -->
    <header class="bg-red-600 p-4 text-center">
        <h1 class="text-white text-4xl font-bold">Super Mario Bros Online</h1>
        <nav class="mt-2" aria-label="Navigation principale">
            <a href="index.html" class="mario-button mx-2">Accueil</a>
            <a href="historique.html" class="mario-button mx-2">Historique</a>
            <a href="gameplay.html" class="mario-button mx-2">Gameplay</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto mt-8 px-4">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Game Section -->
            <div class="flex-grow">
                <div class="mario-border bg-white p-4 rounded-lg">
                    <iframe 
                        src="https://www.retrogames.cc/embed/43806-super-mario-bros-simplified.html"
                        class="w-full aspect-video" 
                        title="Jeu Super Mario Bros en ligne"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- Keyboard Instructions -->
                <section class="mt-6 bg-white p-6 rounded-lg mario-border" aria-labelledby="keyboard-instructions">
                    <h2 id="keyboard-instructions" class="text-2xl font-bold mb-4">Instructions Clavier</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex items-center">
                            <span class="bg-gray-200 p-2 rounded-lg font-mono">←</span>
                            <span class="ml-2">Déplacer à gauche</span>
                        </div>
                        <div class="flex items-center">
                            <span class="bg-gray-200 p-2 rounded-lg font-mono">→</span>
                            <span class="ml-2">Déplacer à droite</span>
                        </div>
                        <div class="flex items-center">
                            <span class="bg-gray-200 p-2 rounded-lg font-mono">Z</span>
                            <span class="ml-2">Sauter</span>
                        </div>
                        <div class="flex items-center">
                            <span class="bg-gray-200 p-2 rounded-lg font-mono">↓</span>
                            <span class="ml-2">S'accroupir</span>
                        </div>
                        <div class="flex items-center">
                            <span class="bg-gray-200 p-2 rounded-lg font-mono">Entrer</span>
                            <span class="ml-2">Start</span>
                        </div>
                        <div class="flex items-center">
                            <span class="bg-gray-200 p-2 rounded-lg font-mono">X</span>
                            <span class="ml-2">Tirer des boules de feu (si disponible)</span>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Sidebar with Ads -->
            <aside class="lg:w-1/4" aria-label="Publicités">
                <div class="bg-white p-4 rounded-lg mario-border">
                    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6979839399771864"
                        data-ad-slot="2254963981" data-ad-format="auto" data-full-width-responsive="true"></ins>
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-red-600 mt-8 py-4 text-center">
        <div class="container mx-auto text-white">
            <p>© 2024 Super Mario Bros Online. Tous droits réservés.</p>
            <div class="mt-2">
                <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px"
                    data-ad-client="ca-pub-6979839399771864" data-ad-slot="1548386971"></ins>

        </div>
    </footer>

    <script>
        // Initialisation Google AdSense
        (adsbygoogle = window.adsbygoogle || []).push({});

        // Focus sur l'iframe au clic
        document.querySelector('iframe').addEventListener('click', () => {
            document.querySelector('iframe').focus();
        });

        // Message de bienvenue
        window.onload = () => {
            alert('Bienvenue sur Super Mario Bros Online ! Appuyez sur OK pour commencer à jouer.');
        }
    </script>
